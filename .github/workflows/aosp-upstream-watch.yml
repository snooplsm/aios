name: AOSP upstream watch

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracking-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out AIOS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch the moving official manifest ref
        run: >-
          git clone --depth 1 --single-branch
          --branch android-latest-release
          https://android.googlesource.com/platform/manifest
          "$RUNNER_TEMP/aosp-manifest"
      - name: Require reviewed tracking state
        run: >-
          python3 tools/refresh_aosp_tracking.py
          --manifest-repo "$RUNNER_TEMP/aosp-manifest"
          --check
